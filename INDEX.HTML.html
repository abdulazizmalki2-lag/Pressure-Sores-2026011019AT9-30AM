<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الخريطة الذهنية التفاعلية: تقرحات الفراش</title>
  <!-- استيراد خط Tajawal العربي الاحترافي -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    /* متغيرات الألوان والتصميم الطبي */
    :root {
      --navy: #1b365d;
      --navy-light: #274b80;
      --crimson: #c82333;
      --crimson-soft: #fdf2f3;
      --teal: #0f766e;
      --amber: #b45309;
      --purple: #5b21b6;
      --bg: #f3f6fa;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #dbe3ee;
      --shadow: 0 8px 24px rgba(27, 54, 93, 0.08);
      --font-scale: 1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "Tajawal", sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text);
      min-height: 100vh;
      font-size: calc(16px * var(--font-scale));
      line-height: 1.65;
    }

    /* شريط التحكم العلوي المثبت */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    }

    .toolbar-title {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge-stop {
      background: var(--crimson);
      color: #fff;
      font-weight: 800;
      padding: 4px 11px;
      border-radius: 8px;
      font-size: 0.85em;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px rgba(200, 35, 51, 0.25);
    }

    .toolbar-title h1 {
      font-size: 1.12em;
      color: var(--navy);
      font-weight: 800;
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      font-family: "Tajawal", sans-serif;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--navy);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.88em;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .btn:hover {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .btn-primary:hover {
      background: var(--navy-light);
    }

    /* حاوية الخريطة الذهنية الرئيسية */
    .mindmap-wrapper {
      position: relative;
      max-width: 1460px;
      margin: 0 auto;
      padding: 36px 24px 80px;
    }

    /* طبقة رسم الخيوط المنحنية SVG */
    #threads-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .thread-path {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke 0.3s ease, stroke-width 0.3s ease, opacity 0.3s ease;
    }

    .thread-sub {
      fill: none;
      stroke-width: 2.5;
      stroke-dasharray: 6 4;
      stroke-linecap: round;
      animation: dashFlow 18s linear infinite;
    }

    @keyframes dashFlow {
      to {
        stroke-dashoffset: -120;
      }
    }

    /* شبكة الأعمدة الثلاثة للخريطة الذهنية */
    .mindmap-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 250px 310px minmax(0, 1fr);
      align-items: center;
      gap: 56px;
    }

    /* العمود الأول: العقدة المركزية */
    .root-column {
      display: flex;
      justify-content: center;
    }

    .root-node {
      background: linear-gradient(135deg, var(--navy) 0%, #102341 100%);
      color: #fff;
      padding: 28px 20px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 14px 32px rgba(27, 54, 93, 0.25);
      border: 3px solid #fff;
      width: 100%;
    }

    .root-node-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .root-node h2 {
      font-size: 1.42em;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .root-node .en-sub {
      display: inline-block;
      font-size: 0.8em;
      font-weight: 700;
      background: rgba(200, 35, 51, 0.9);
      color: #fff;
      padding: 2px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .root-node p {
      font-size: 0.85em;
      color: #cbd5e1;
      line-height: 1.55;
    }

    /* العمود الثاني: المحاور الخمسة الأساسية */
    .main-nodes-column {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .main-node {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 16px 18px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      user-select: none;
    }

    .main-node:hover {
      transform: translateX(-4px);
    }

    .main-node.active {
      color: #fff;
      transform: translateX(-6px) scale(1.02);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
    }

    .main-node-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .node-num {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1em;
      flex-shrink: 0;
    }

    .main-node h3 {
      font-size: 1.05em;
      font-weight: 800;
      line-height: 1.35;
      word-wrap: break-word;
    }

    .main-node span.hint {
      font-size: 0.8em;
      opacity: 0.84;
      display: block;
      margin-top: 2px;
    }

    .chevron {
      font-size: 1.05em;
      font-weight: bold;
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }

    .main-node.active .chevron {
      transform: rotate(180deg);
    }

    /* العمود الثالث: التقسيمات الفرعية والشروحات */
    .sub-nodes-column {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 380px;
      justify-content: center;
      min-width: 0;
    }

    .empty-state {
      background: rgba(255, 255, 255, 0.88);
      border: 2px dashed #cbd5e1;
      border-radius: 20px;
      padding: 44px 24px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state .icon {
      font-size: 2.5em;
      margin-bottom: 10px;
      display: block;
    }

    .empty-state h3 {
      color: var(--navy);
      margin-bottom: 6px;
      font-size: 1.2em;
    }

    .branch-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: fadeSlideIn 0.35s ease forwards;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateX(14px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .branch-header-banner {
      padding: 12px 18px;
      border-radius: 14px;
      color: #fff;
      font-weight: 800;
      font-size: 1.08em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    }

    /* بطاقة التقسيمة الفرعية */
    .sub-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
      transition: all 0.25s ease;
    }

    .sub-card:hover {
      border-color: #b8c7dc;
    }

    .sub-card-header {
      padding: 15px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fff;
      transition: background 0.2s ease;
      user-select: none;
    }

    .sub-card-header:hover {
      background: #f8fafc;
    }

    .sub-card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.04em;
      color: var(--navy);
      min-width: 0;
    }

    .dot-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .toggle-pill {
      font-size: 0.78em;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      background: #f1f5f9;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .sub-card.open .toggle-pill {
      background: var(--navy);
      color: #fff;
    }

    /* جسم الشرح المنسدل تحت التقسيمة */
    .sub-card-body {
      display: none;
      padding: 0 20px 20px 20px;
      border-top: 1px solid #f1f5f9;
      background: #fcfdff;
    }

    .sub-card.open .sub-card-body {
      display: block;
      animation: expandDown 0.25s ease;
    }

    @keyframes expandDown {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .explanation-list {
      list-style: none;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .explanation-list li {
      position: relative;
      padding-right: 22px;
      line-height: 1.7;
      color: #334155;
      font-size: 0.98em;
      word-wrap: break-word;
    }

    .explanation-list li::before {
      content: "•";
      position: absolute;
      right: 2px;
      top: -2px;
      font-size: 1.35em;
      font-weight: 800;
      color: var(--crimson);
    }

    /* ============================================================
       مكونات البطاقات البصرية الهجينة (HTML نظيف + SVG متجهي نقي)
       تضمن عدم قص أي نص عربي مهما كان حجم الشاشة
       ============================================================ */
    .visual-box {
      margin-top: 16px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .visual-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .visual-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .visual-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .v-card {
      background: #ffffff;
      border: 1.5px solid #dbe3ee;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .v-card.success {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    .v-card.danger {
      background: #fef2f2;
      border-color: #fecaca;
    }

    .v-card.info {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .v-card.teal {
      background: #f0fdfa;
      border-color: #99f6e4;
    }

    .v-card.amber {
      background: #fffbeb;
      border-color: #fde68a;
    }

    .v-card.purple {
      background: #f5f3ff;
      border-color: #ddd6fe;
    }

    .v-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .v-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #f1f5f9;
    }

    .v-card h4 {
      font-size: 0.96em;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.35;
      word-wrap: break-word;
    }

    .v-card p {
      font-size: 0.88em;
      color: #475569;
      line-height: 1.55;
      word-wrap: break-word;
    }

    .v-svg-stage {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .v-svg-stage svg {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* شارات نقاط الضغط المرقمة تحت رسومات الوضعيات */
    .pin-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .pin-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.82em;
      font-weight: 700;
    }

    .pin-num {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: #dc2626;
      color: #fff;
      font-size: 0.82em;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* نبض نقاط الضغط في SVG */
    @keyframes pulseDot {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.55;
        transform: scale(1.22);
      }
    }

    .pulse-point {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseDot 2s ease-in-out infinite;
    }

    /* شارة الوقت للمراحل الأربع */
    .stage-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78em;
      font-weight: 800;
      width: fit-content;
    }

    /* صف أكواب الماء العشرة */
    .cups-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 8px 0;
    }

    .cup-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.75em;
      font-weight: 800;
      color: #1d4ed8;
    }

    .visual-caption {
      font-size: 0.85em;
      font-weight: 700;
      color: var(--navy);
      background: #e2e8f0;
      padding: 6px 14px;
      border-radius: 20px;
      text-align: center;
      align-self: center;
    }

    /* التجاوب مع الشاشات المتوسطة والصغيرة */
    @media (max-width: 1120px) {
      .mindmap-grid {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .root-node {
        max-width: 440px;
      }

      .main-nodes-column {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }

      .main-node:hover,
      .main-node.active {
        transform: translateY(-3px);
      }

      .visual-grid-4 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      .toolbar {
        padding: 10px 14px;
      }
      .mindmap-wrapper {
        padding: 20px 12px 60px;
      }
      .sub-card-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .toggle-pill {
        align-self: flex-end;
      }
      .visual-grid-2,
      .visual-grid-3,
      .visual-grid-4 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- شريط التحكم العلوي -->
  <header class="toolbar">
    <div class="toolbar-title">
      <span class="badge-stop">STOP</span>
      <h1>الخريطة الذهنية التفاعلية: تقرحات الفراش (إصابات الضغط)</h1>
    </div>
    <div class="toolbar-actions">
      <button class="btn btn-primary" onclick="expandAll()">📂 فتح جميع التقسيمات والشروحات</button>
      <button class="btn" onclick="resetMap()">🔄 طي الكل (وضع البداية)</button>
      <button class="btn" onclick="changeFontSize(0.1)">A+ تكبير</button>
      <button class="btn" onclick="changeFontSize(-0.1)">A- تصغير</button>
    </div>
  </header>

  <!-- حاوية الخريطة الذهنية -->
  <main class="mindmap-wrapper" id="mindmap-wrapper">
    <!-- طبقة رسم الخيوط المنحنية الديناميكية -->
    <svg id="threads-svg"></svg>

    <div class="mindmap-grid">
      <!-- 1. العقدة المركزية -->
      <div class="root-column">
        <div class="root-node" id="root-node">
          <div class="root-node-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="M12 8v4"/>
              <path d="M12 16h.01"/>
            </svg>
          </div>
          <h2>تقرحات الفراش</h2>
          <span class="en-sub">Pressure Injury</span>
          <p>اختر أي محور من المحاور الخمسة لاستكشاف المعلومات والرسوم التوضيحية</p>
        </div>
      </div>

      <!-- 2. المحاور الخمسة الأساسية -->
      <div class="main-nodes-column" id="main-nodes-container"></div>

      <!-- 3. التقسيمات الفرعية والشروحات -->
      <div class="sub-nodes-column" id="sub-nodes-container">
        <div class="empty-state" id="empty-state">
          <span class="icon">👈</span>
          <h3>استكشف الخريطة الذهنية</h3>
          <p>اضغط على أي محور من المحاور الخمسة لتتفرع منه الأقسام، ثم اضغط على أي قسم لعرض الشرح والصور التوضيحية.</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    /**
     * مكتبة المكونات البصرية الهجينة (HTML + Pure Vector SVG بدون أي نصوص داخل SVG)
     * تضمن وضوحاً فائقاً وملاءمة تامة للغة العربية RTL على كافة الشاشات
     */
    const visualBlocks = {
      // 1.1 آلية الحدوث (انضغاط الشعيرات الدموية بين العظم والسطح)
      mechanism: `
        <div class="visual-box">
          <div class="visual-grid-2">
            <div class="v-card success">
              <h4>١. الوضع الطبيعي (حركة مستمرة)</h4>
              <div class="v-svg-stage">
                <svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
                  <!-- طبقة الجلد -->
                  <rect x="15" y="14" width="230" height="18" rx="7" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5"/>
                  <!-- وعاء دموي مفتوح وتدفق دم سليم -->
                  <rect x="15" y="42" width="230" height="24" rx="12" fill="#ef4444"/>
                  <line x1="225" y1="54" x2="40" y2="54" stroke="#ffffff" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
                  <polygon points="32,54 46,47 46,61" fill="#ffffff"/>
                  <!-- طبقة العظم -->
                  <rect x="45" y="76" width="170" height="20" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
                </svg>
              </div>
              <p>تتمدد الشعيرات الدموية بحرية ويمر الدم محملاً بالأكسجين والغذاء إلى طبقة الجلد والأنسجة.</p>
            </div>

            <div class="v-card danger">
              <h4>٢. عند الضغط المستمر (قلة الحركة)</h4>

        : mindMapData.filter((item) => item.id === activeMainId);

      if (selectedItems.length === 0) {
        subContainer.innerHTML = `
          <div class="empty-state" id="empty-state">
            <span class="icon">👈</span>
            <h3>استكشف الخريطة الذهنية</h3>
            <p>اضغط على أي محور من المحاور الخمسة لتتفرع منه الأقسام، ثم اضغط على أي قسم لعرض الشرح والصور التوضيحية.</p>
          </div>
        `;
        requestAnimationFrame(drawThreads);
        return;
      }

      selectedItems.forEach((item) => {
        const group = document.createElement("div");
        group.className = "branch-group";
        group.id = `group-${item.id}`;

        if (showAllMode) {
          const banner = document.createElement("div");
          banner.className = "branch-header-banner";
          banner.style.background = item.color;
          banner.innerHTML = `<span>${item.number}. ${item.title}</span><span>(${item.subNodes.length} تقسيمات)</span>`;
          group.appendChild(banner);
        }

        item.subNodes.forEach((sub, idx) => {
          const card = document.createElement("div");
          card.className = `sub-card ${openAllDetails ? "open" : ""}`;
          card.id = `sub-${item.id}-${idx}`;
          card.dataset.parentId = item.id;
          card.dataset.color = item.color;

          const detailsHtml = sub.details.map((d) => `<li>${d}</li>`).join("");
          const visualHtml = sub.visualKey && visualBlocks[sub.visualKey]
            ? visualBlocks[sub.visualKey]
            : "";

          card.innerHTML = `
            <div class="sub-card-header">
              <div class="sub-card-title">
                <span class="dot-indicator" style="background: ${item.color}"></span>
                <span>${sub.title}</span>
              </div>
              <span class="toggle-pill">${openAllDetails ? "إخفاء الشرح والصور ▲" : "عرض الشرح والصور ▼"}</span>
            </div>
            <div class="sub-card-body">
              <ul class="explanation-list">${detailsHtml}</ul>
              ${visualHtml}
            </div>
          `;

          const header = card.querySelector(".sub-card-header");
          const pill = card.querySelector(".toggle-pill");
          header.addEventListener("click", () => {
            const isOpen = card.classList.toggle("open");
            pill.textContent = isOpen ? "إخفاء الشرح والصور ▲" : "عرض الشرح والصور ▼";
            requestAnimationFrame(drawThreads);
          });

          group.appendChild(card);
        });

        subContainer.appendChild(group);
      });

      requestAnimationFrame(drawThreads);
    }

    /**
     * رسم الخيوط المنحنية (SVG Bezier Curves) بين العقدة المركزية والمحاور والتقسيمات
     */
    function drawThreads() {
      try {
        svgEl.innerHTML = "";
        const wrapperRect = wrapperEl.getBoundingClientRect();
        svgEl.setAttribute("width", wrapperRect.width);
        svgEl.setAttribute("height", wrapperRect.height);

        const rootEl = document.getElementById("root-node");
        if (!rootEl) return;
        const rootRect = rootEl.getBoundingClientRect();
        const isMobile = window.innerWidth <= 1120;

        // 1. خيوط من العقدة المركزية إلى المحاور الأساسية الخمسة
        mindMapData.forEach((item) => {
          const mainEl = document.getElementById(`main-${item.id}`);
          if (!mainEl) return;
          const mainRect = mainEl.getBoundingClientRect();
          const isActive = showAllMode || activeMainId === item.id;

          const path = createBezierPath(
            rootRect,
            mainRect,
            wrapperRect,
            isMobile,
            isActive ? item.color : "#cbd5e1",
            isActive ? 3.5 : 2,
            isActive ? 1 : 0.65,
            false
          );
          svgEl.appendChild(path);
        });

        // 2. خيوط متحركة من المحور الأساسي النشط إلى تقسيماته الفرعية
        const subCards = document.querySelectorAll(".sub-card");
        subCards.forEach((subEl) => {
          const parentId = subEl.dataset.parentId;
          const color = subEl.dataset.color;
          const mainEl = document.getElementById(`main-${parentId}`);
          if (!mainEl) return;

          const mainRect = mainEl.getBoundingClientRect();
          const subRect = subEl.getBoundingClientRect();

          const path = createBezierPath(
            mainRect,
            subRect,
            wrapperRect,
            isMobile,
            color,
            2.6,
            0.9,
            true
          );
          svgEl.appendChild(path);
        });
      } catch (err) {
        console.error("Error drawing SVG threads:", err);
      }
    }

    /**
     * حساب إحداثيات منحنى بيزيه (Bezier Curve) حسب اتجاه الشاشة
     */
    function createBezierPath(fromRect, toRect, containerRect, isMobile, color, width, opacity, isSub) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      let startX, startY, endX, endY, d;

      if (!isMobile) {
        startX = fromRect.left - containerRect.left;
        startY = fromRect.top + fromRect.height / 2 - containerRect.top;
        endX = toRect.right - containerRect.left;
        endY = toRect.top + toRect.height / 2 - containerRect.top;
        const midX = (startX + endX) / 2;
        d = `M ${startX} ${startY} C ${midX} ${startY}, ${midX} ${endY}, ${endX} ${endY}`;
      } else {
        startX = fromRect.left + fromRect.width / 2 - containerRect.left;
        startY = fromRect.bottom - containerRect.top;
        endX = toRect.left + toRect.width / 2 - containerRect.left;
        endY = toRect.top - containerRect.top;
        const midY = (startY + endY) / 2;
        d = `M ${startX} ${startY} C ${startX} ${midY}, ${endX} ${midY}, ${endX} ${endY}`;
      }

      path.setAttribute("d", d);
      path.setAttribute("stroke", color);
      path.setAttribute("stroke-width", width);
      path.setAttribute("opacity", opacity);
      path.setAttribute("class", isSub ? "thread-sub" : "thread-path");
      return path;
    }

    function renderAll(openAllDetails = false) {
      renderMainNodes();
      renderSubNodes(openAllDetails);
    }

    function expandAll() {
      showAllMode = true;
      activeMainId = null;
      renderAll(true);
    }

    function resetMap() {
      showAllMode = false;
      activeMainId = null;
      renderAll(false);
    }

    function changeFontSize(delta) {
      currentFontScale = Math.min(1.3, Math.max(0.85, +(currentFontScale + delta).toFixed(2)));
      document.documentElement.style.setProperty("--font-scale", currentFontScale);
      requestAnimationFrame(drawThreads);
    }

    window.addEventListener("resize", () => requestAnimationFrame(drawThreads));
    if (typeof ResizeObserver !== "undefined") {
      const resizeObserver = new ResizeObserver(() => requestAnimationFrame(drawThreads));
      resizeObserver.observe(wrapperEl);
    }

    window.onload = function () {
      renderAll();
    };
  </script>
</body>
</html>
